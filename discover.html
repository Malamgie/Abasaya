<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Lineage | Abasaya Family Heritage</title>
    <meta name="description" content="Explore the branches and heads of the Abasaya family.">
    
    <!-- Google Fonts for Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: { 900: '#062c22', 800: '#064e3b', 700: '#047857' },
                        gold: { 400: '#eab308', 500: '#d4af37', 600: '#b8962e' },
                        parchment: '#fdfbf7',
                        charcoal: '#171717'
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Inter"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #fdfbf7; color: #171717; }
        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.5, 0, 0, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        .branch-card {
            background: #ffffff;
            border: 1px solid rgba(212, 175, 55, 0.15);
            transition: all 0.4s ease;
        }
        .branch-card:hover {
            box-shadow: 0 20px 40px -10px rgba(6, 44, 34, 0.08);
            transform: translateY(-5px);
            border-color: rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col">

    <app-header></app-header>

    <main class="flex-grow pt-32 pb-24 px-6 lg:px-12 max-w-7xl mx-auto w-full">
        
        <!-- Header Section -->
        <div class="text-center mb-24 reveal active">
            <span class="text-gold-600 tracking-[0.3em] uppercase text-xs font-bold mb-4 block">The Pillars of the Family</span>
            <h1 class="font-serif text-5xl md:text-6xl text-forest-900 font-medium mb-6">Discover Our Lineage</h1>
            <p class="text-gray-600 max-w-2xl mx-auto font-light leading-relaxed text-lg">
                Explore the major branches of the Abasaya family. Each head of the family represents a unique lineage, carrying forward the values and heritage of Late Musa Ibrahim.
            </p>
        </div>

        <!-- Branches Grid -->
        <div id="branches-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-x-10 gap-y-16 pt-8">
            <!-- Loading Skeleton -->
            <div class="col-span-full text-center py-12">
                <div class="inline-block w-8 h-8 border-4 border-gold-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-gray-400 font-serif italic text-lg">Retrieving family branches...</p>
            </div>
        </div>

    </main>

    <app-footer></app-footer>

    <!-- Scripts -->
    <script type="module" src="js/components.js"></script>
    <script type="module">
        // Import directly from the exact provided seed data file
        import { familySeedData } from './js/family-data.js';

        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('branches-grid');
            const branches = familySeedData.branches;

            if (!branches || branches.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-500 font-serif italic">No family branches found in archive.</p>`;
                return;
            }

            grid.innerHTML = branches.map((branch, index) => {
                // Route Garba Musa (index 0) to his specific SPA, others dynamically to branch.html using their array index
                const isFirstSon = index === 0;
                const linkUrl = isFirstSon ? 'garba-musa.html' : `branch.html?id=${index}`;
                
                // First Son visual indicator
                const firstSonBadge = isFirstSon 
                    ? `<div class="absolute top-0 right-0 transform translate-x-2 -translate-y-2 bg-gold-500 text-forest-900 text-[0.65rem] font-bold uppercase tracking-widest py-1 px-3 rounded-sm shadow-md z-10">First Son</div>` 
                    : '';

                // Calculate total children for this specific branch
                const directChildrenCount = branch.descendants ? branch.descendants.length : 0;
                const delay = (index % 6) * 100; // Staggered animation delay

                return `
                    <a href="${linkUrl}" class="branch-card relative block rounded-lg p-8 pt-12 mt-8 text-center group reveal" style="animation-delay: ${delay}ms">
                        ${firstSonBadge}
                        
                        <!-- Elegant Circled Image Overlapping Border -->
                        <div class="absolute -top-16 left-1/2 -translate-x-1/2 w-32 h-32 rounded-full border-4 border-parchment shadow-xl overflow-hidden bg-forest-900 group-hover:border-gold-500 transition-colors duration-300">
                            <!-- Image fallback placeholder -->
                            <img src="assets/images/${branch.branchName}.jpg" alt="${branch.branchName}" class="w-full h-full object-cover grayscale opacity-80 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-500">
                        </div>
                        
                        <!-- Card Content -->
                        <div class="mt-8">
                            <h2 class="font-serif text-3xl text-forest-900 font-semibold mb-2 group-hover:text-gold-600 transition-colors line-clamp-1">${branch.branchName}</h2>
                            <p class="text-[0.65rem] uppercase tracking-[0.2em] text-gray-400 mb-6 font-semibold">Head of Family</p>
                            
                            <div class="flex justify-center items-center gap-6 mb-8 py-4 border-y border-gray-100">
                                <div class="text-center">
                                    <span class="block text-3xl font-serif text-forest-800">${directChildrenCount}</span>
                                    <span class="text-[0.6rem] uppercase tracking-widest text-gray-500 font-semibold">Direct Children</span>
                                </div>
                            </div>
                            
                            <span class="inline-flex items-center text-sm font-semibold text-gold-600 uppercase tracking-widest group-hover:text-forest-900 transition-colors">
                                Explore Lineage
                                <svg class="w-4 h-4 ml-2 transform group-hover:translate-x-2 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                            </span>
                        </div>
                    </a>
                `;
            }).join('');

            // Trigger staggered reveal animations
            setTimeout(() => {
                document.querySelectorAll('.reveal').forEach(el => el.classList.add('active'));
            }, 50);
        });
    </script>
</body>
</html>
