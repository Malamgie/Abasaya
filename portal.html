<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Abasaya Family Heritage</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: { 900: '#062c22', 800: '#064e3b', 700: '#047857' },
                        gold: { 400: '#eab308', 500: '#d4af37', 600: '#b8962e' },
                        parchment: '#fdfbf7',
                        charcoal: '#171717'
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Inter"', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans antialiased text-charcoal bg-parchment min-h-screen flex flex-col">
    
    <app-header></app-header>

    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative bg-forest-900">
        <!-- Cinematic Background -->
        <div class="absolute inset-0 bg-[url('assets/images/hero-family-placeholder.jpg')] bg-cover bg-center opacity-20 mix-blend-overlay"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-forest-900 via-forest-900/80 to-transparent"></div>
        
        <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-sm shadow-2xl relative z-10 border-t-4 border-gold-500">
            <div>
                <h2 class="mt-2 text-center text-3xl font-serif font-medium text-forest-900">
                    Administrative Access
                </h2>
                <p class="mt-3 text-center text-sm text-gray-500 font-light leading-relaxed">
                    Secure portal for verified family administrators. Use your registered Firebase Admin email to authenticate.
                </p>
            </div>
            
            <form id="login-form" class="mt-8 space-y-6">
                <div id="error-message" class="hidden bg-red-50 text-red-600 text-sm p-4 rounded-sm border border-red-100 text-center font-medium"></div>
                
                <div class="space-y-4">
                    <div>
                        <label for="email" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Admin Email</label>
                        <input id="email" name="email" type="email" required class="appearance-none block w-full px-4 py-3 border border-gray-200 bg-gray-50 text-gray-900 rounded-sm focus:outline-none focus:ring-2 focus:ring-gold-500 focus:bg-white transition-colors sm:text-sm shadow-inner" placeholder="admin@abasaya.family">
                    </div>
                    <div>
                        <label for="password" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Password</label>
                        <input id="password" name="password" type="password" required class="appearance-none block w-full px-4 py-3 border border-gray-200 bg-gray-50 text-gray-900 rounded-sm focus:outline-none focus:ring-2 focus:ring-gold-500 focus:bg-white transition-colors sm:text-sm shadow-inner" placeholder="••••••••">
                    </div>
                </div>

                <div>
                    <button type="submit" id="submit-btn" class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-sm font-bold uppercase tracking-widest rounded-sm text-forest-900 bg-gold-500 hover:bg-gold-400 focus:outline-none shadow-md transition-all">
                        Authenticate
                        <svg class="w-5 h-5 ml-2 text-forest-900/50 group-hover:text-forest-900 group-hover:translate-x-1 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-[0.65rem] text-gray-400 uppercase tracking-widest font-semibold border-t border-gray-100 pt-6">Protected by Firebase Auth</p>
            </div>
        </div>
    </main>

    <app-footer></app-footer>

    <script type="module" src="js/components.js"></script>
    <script type="module">
        import { AuthService } from './js/auth.js';
        import { USE_LIVE_FIREBASE } from './js/firebase-config.js';

        const form = document.getElementById('login-form');
        const btn = document.getElementById('submit-btn');
        const errorDiv = document.getElementById('error-message');

        // Check if user is already logged in
        AuthService.onStateChange(user => {
            if (user) {
                window.location.href = 'admin.html';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!USE_LIVE_FIREBASE) {
                errorDiv.innerText = "Configuration Required: Please enable FIREBASE_ENABLED in js/firebase-config.js and add your project keys.";
                errorDiv.classList.remove('hidden');
                return;
            }

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            btn.innerHTML = 'Authenticating...';
            btn.disabled = true;
            errorDiv.classList.add('hidden');

            try {
                await AuthService.login(email, password);
                
                // Success UI Feedback
                btn.innerHTML = 'Access Granted';
                btn.classList.replace('bg-gold-500', 'bg-forest-800');
                btn.classList.replace('text-forest-900', 'text-parchment');
                
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 600);

            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.classList.remove('hidden');
                btn.innerHTML = 'Authenticate <svg class="w-5 h-5 ml-2 text-forest-900/50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
