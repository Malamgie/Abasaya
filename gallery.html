
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Abasaya Family Heritage</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/components.js"></script>
</head>
<body class="font-sans antialiased text-charcoal bg-parchment min-h-screen flex flex-col">
    <app-header></app-header>
    <main class="flex-grow py-16 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">
        <div class="text-center mb-12">
            <h1 class="font-serif text-4xl font-bold text-forest mb-4">Family Archive</h1>
            <p class="text-gray-600 max-w-2xl mx-auto">Preserving visual memories across generations.</p>
        </div>
        
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- 8 Image Placeholders -->
            <div class="aspect-square bg-gray-200 rounded relative overflow-hidden group">
                <img src="assets/images/gallery/gallery-placeholder-01.jpg" alt="Gallery Placeholder" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex items-end p-4 transition duration-300">
                    <p class="text-white text-sm font-semibold">Archival Photo</p>
                </div>
            </div>
            <div class="aspect-square bg-gray-200 rounded relative overflow-hidden group">
                <img src="assets/images/gallery/gallery-placeholder-02.jpg" alt="Gallery Placeholder" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
            </div>
            <div class="aspect-square bg-gray-200 rounded relative overflow-hidden group">
                <img src="assets/images/gallery/gallery-placeholder-03.jpg" alt="Gallery Placeholder" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
            </div>
            <div class="aspect-square bg-gray-200 rounded flex items-center justify-center border-2 border-dashed border-gray-300 text-gray-400">
                <span class="text-sm font-semibold">More images pending</span>
            </div>
        </div>
    </main>
    <app-footer></app-footer>
</body>
</html>
