
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Directory | Abasaya Family Heritage</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/components.js"></script>
</head>
<body class="font-sans antialiased text-charcoal bg-parchment min-h-screen flex flex-col">
    
    <app-header></app-header>

    <main class="flex-grow py-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">
        <div class="mb-10 text-center">
            <h1 class="font-serif text-4xl font-bold text-forest mb-4">Family Directory</h1>
            <p class="text-gray-600 max-w-2xl mx-auto">Search and explore the known members of the Abasaya family tree.</p>
        </div>

        <div class="mb-8 max-w-xl mx-auto relative">
            <input type="text" id="search-input" placeholder="Search by name or branch..." class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-forest shadow-sm pl-12">
            <svg class="w-5 h-5 absolute left-4 top-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>

        <div id="results-count" class="text-sm text-gray-500 mb-4 font-semibold text-center"></div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="directory-grid">
            <!-- Rendered by JS -->
            <div class="col-span-full text-center py-12 text-gray-400 italic">Loading directory data...</div>
        </div>
    </main>

    <app-footer></app-footer>

    <script type="module">
        import { FamilyService } from './js/firebase-service.js';

        let directoryData = [];
        const grid = document.getElementById('directory-grid');
        const searchInput = document.getElementById('search-input');
        const resultsCount = document.getElementById('results-count');

        async function init() {
            try {
                directoryData = await FamilyService.getFlatDirectory();
                renderGrid(directoryData);
            } catch (e) {
                grid.innerHTML = `<div class="col-span-full text-center text-red-500">Error loading data.</div>`;
            }
        }

        function renderGrid(data) {
            resultsCount.innerText = `Showing ${data.length} family members`;
            
            if (data.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-white rounded-lg border border-gray-200">
                        <p class="text-gray-500 text-lg">No family member found.</p>
                        <p class="text-sm text-gray-400 mt-2">Try adjusting your search criteria.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = data.map(person => {
                const uncertain = person.name.includes('(?)') ? '<span class="inline-block px-2 py-0.5 ml-2 text-[10px] font-bold uppercase rounded bg-orange-100 text-orange-800 border border-orange-200">Needs Verification</span>' : '';
                const avatarInitial = person.name.charAt(0) !== '*' ? person.name.charAt(0) : '?';
                
                return `
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-5 hover:shadow-md transition-shadow flex flex-col items-center text-center fade-in">
                        <div class="w-16 h-16 rounded-full bg-forest text-gold flex items-center justify-center text-2xl font-serif font-bold mb-3 shadow-inner">
                            ${avatarInitial}
                        </div>
                        <h3 class="font-bold text-gray-900 mb-1">${person.name} ${uncertain}</h3>
                        <p class="text-xs text-gray-500 uppercase tracking-wide bg-gray-50 px-2 py-1 rounded w-full line-clamp-1">${person.branchName}</p>
                    </div>
                `;
            }).join('');
        }

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = directoryData.filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.branchName.toLowerCase().includes(query)
            );
            renderGrid(filtered);
        });

        init();
    </script>
</body>
</html>
