<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements | Abasaya Family Heritage</title>
    <meta name="description" content="Official communications and announcements for the Abasaya family.">
    
    <!-- Google Fonts for Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: { 900: '#062c22', 800: '#064e3b', 700: '#047857' },
                        gold: { 400: '#eab308', 500: '#d4af37', 600: '#b8962e' },
                        parchment: '#fdfbf7',
                        charcoal: '#171717'
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Inter"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #fdfbf7; color: #171717; }
        .hero-gradient { background: linear-gradient(180deg, rgba(6,44,34,0.03) 0%, rgba(253,251,247,1) 100%); }
        .reveal { opacity: 0; transform: translateY(20px); transition: all 0.6s cubic-bezier(0.5, 0, 0, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #fdfbf7; }
        ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 10px; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col overflow-x-hidden">

    <app-header></app-header>

    <main class="flex-grow w-full relative pt-32 pb-24">
        
        <section class="relative px-6 hero-gradient border-b border-gold-500/10 pb-16 mb-16">
            <div class="max-w-4xl mx-auto text-center reveal active">
                <div class="inline-flex items-center justify-center gap-4 mb-6">
                    <span class="h-px w-12 bg-gradient-to-r from-transparent to-gold-500"></span>
                    <span class="text-gold-600 tracking-[0.3em] uppercase text-xs font-bold">Family Desk</span>
                    <span class="h-px w-12 bg-gradient-to-l from-transparent to-gold-500"></span>
                </div>
                
                <h1 class="font-serif text-5xl md:text-6xl text-forest-900 font-medium mb-6 leading-tight">Official Communications</h1>
                
                <p class="text-gray-600 max-w-2xl mx-auto font-light leading-relaxed text-lg">
                    Stay informed with the latest updates, official announcements, and family news broadcasted by the administration.
                </p>
            </div>
        </section>

        <section class="max-w-4xl mx-auto px-6 lg:px-12 relative z-10">
            <div id="announcements-container" class="space-y-8">
                <!-- Loading Skeleton -->
                <div class="text-center py-20">
                    <div class="inline-block w-8 h-8 border-4 border-gold-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p class="text-gray-400 font-serif italic text-lg">Retrieving official communications...</p>
                </div>
            </div>
        </section>

    </main>

    <app-footer></app-footer>

    <script type="module" src="js/components.js"></script>
    <script type="module">
        import { DBService } from './js/db.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('announcements-container');
            
            try {
                const announcements = await DBService.getAnnouncements();
                
                if (!announcements || announcements.length === 0) {
                    container.innerHTML = `
                        <div class="bg-white p-12 rounded-sm border border-gray-100 shadow-sm text-center reveal active">
                            <div class="w-16 h-16 mx-auto bg-gray-50 rounded-full flex items-center justify-center text-gray-300 mb-4">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                            </div>
                            <h3 class="font-serif text-2xl text-forest-900 mb-2">No Announcements Yet</h3>
                            <p class="text-gray-500 font-light">The administration has not posted any official communications.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = announcements.map((a, index) => {
                    const dateObj = new Date(a.timestamp);
                    const formattedDate = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                    const delay = (index % 5) * 100;

                    return `
                        <article class="bg-white p-8 md:p-10 rounded-sm border border-gray-100 shadow-[0_10px_40px_-10px_rgba(6,44,34,0.05)] reveal active relative overflow-hidden" style="animation-delay: ${delay}ms;">
                            <!-- Top accent border -->
                            <div class="absolute top-0 left-0 w-full h-1 bg-forest-900"></div>
                            
                            <div class="flex flex-col md:flex-row justify-between md:items-center gap-4 mb-6 pb-6 border-b border-gray-100">
                                <time class="font-serif italic text-gray-400">${formattedDate}</time>
                                ${a.emailed ? '<span class="inline-flex items-center px-2.5 py-1 rounded text-[0.65rem] font-bold bg-forest-50 text-forest-800 uppercase tracking-widest border border-forest-100"><svg class="w-3 h-3 mr-1.5 text-gold-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg> Broadcasted via Email</span>' : ''}
                            </div>
                            
                            <h2 class="font-serif text-3xl text-forest-900 font-medium mb-6">${a.title}</h2>
                            
                            <div class="prose prose-lg text-gray-600 font-light leading-loose whitespace-pre-wrap">${a.body}</div>
                        </article>
                    `;
                }).join('');

            } catch (error) {
                console.error("Error fetching announcements:", error);
                container.innerHTML = `
                    <div class="bg-red-50 p-6 rounded border border-red-100 text-center text-red-600">
                        Failed to load communications from the digital archive. Please try again later.
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
