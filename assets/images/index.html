
<!DOCTYPE html>

        tailwind.config = {

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow-x: hidden; }

        @keyframes fadeIn {
            from { opacity: 0; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }

        /* Hide scrollbar for horizontal scrolling containers */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        #toast-container {
            position: fixed;

            right: 1rem;

</head>
<body class="text-slate-800 antialiased">

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- Main App Container (SPA Root) -->
    <div id="app" class="min-h-screen w-full relative">
        <!-- Content will be injected here via JavaScript -->
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration (Environment variables injected by platform)
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // Dummy config for fallback visual rendering
            apiKey: "dummy", authDomain: "dummy", projectId: "dummy"
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'origin-pay-dev';

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch(e) {
            console.error("Firebase init failed (expected if previewing locally without config):", e);
        }

        const state = {
            view: 'landing', // 'landing', 'login', 'signup', 'forgot', 'dashboard', 'service'
            user: null,
            walletBalance: 0.00,
            currentService: null, // Holds data for the active service modal
            isLoading: false
        };

        const dom = {
            app: document.getElementById('app')
        };

        // --- UTILITY FUNCTIONS ---
        // Custom alternative to alert()
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-blue-600';
            if(type === 'success') bgClass = 'bg-green-600';
            if(type === 'error') bgClass = 'bg-red-600';

            toast.className = `${bgClass} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 slide-up text-sm font-medium`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-circle-exclamation' : 'fa-info-circle'}"></i> ${message}`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.navigate = function(view, data = null) {
            state.view = view;
            if(data) state.currentService = data;
            render();
            window.scrollTo(0, 0);
        };

        async function mockVercelApiCall(endpoint, payload) {
            // 🚨 SECURITY NOTICE 🚨
            // In a real app, this function would make a fetch() request to your Vercel backend:
            // return fetch(`/api/${endpoint}`, { method: 'POST', body: JSON.stringify(payload) })
            // The backend securely talks to Monnify/VTpass using env variables.
            
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    if (Math.random() > 0.1) { // 90% success rate simulation
                        resolve({ status: 'success', message: 'Transaction successful' });
                    } else {
                        reject({ status: 'error', message: 'Provider timeout. Please try again.' });
                    }
                }, 1500); // simulate network delay
            });
        }

        // --- RENDER VIEWS ---

        function renderLanding() {
            return `
                <div class="fade-in min-h-screen bg-white">
                    <!-- Navbar -->
                    <nav class="flex justify-between items-center p-6 max-w-6xl mx-auto">
                        <div class="flex items-center gap-2 text-primary font-bold text-2xl">
                            <div class="w-8 h-8 rounded-lg bg-primary text-white flex items-center justify-center">
                                <i class="fa-solid fa-bolt"></i>
                            </div>
                            Origin Pay
                        </div>
                        <div class="hidden md:flex gap-6 text-slate-600 font-medium">
                            <a href="#" class="hover:text-primary transition">Services</a>
                            <a href="#" class="hover:text-primary transition">Agents</a>
                            <a href="#" class="hover:text-primary transition">Contact</a>
                        </div>
                        <div class="flex gap-4">

                            <button onclick="navigate('signup')" class="bg-primary hover:bg-primaryDark text-white px-5 py-2 rounded-full font-medium transition shadow-md shadow-primary/30">Get Started</button>
                        </div>
                    </nav>

                    <!-- Hero Section -->
                    <main class="max-w-6xl mx-auto px-6 py-16 md:py-24 flex flex-col-reverse md:flex-row items-center gap-12">
                        <div class="flex-1 text-center md:text-left">
                            <h1 class="text-4xl md:text-6xl font-extrabold text-slate-900 leading-tight mb-6">
                                Your everyday <br> <span class="text-primary">digital services.</span>
                            </h1>
                            <p class="text-lg text-slate-600 mb-8 max-w-lg mx-auto md:mx-0">
                                Pay bills, buy airtime, verify identities (NIN/BVN), and manage virtual accounts all in one secure platform.
                            </p>
                            <div class="flex flex-col sm:flex-row gap-4 justify-center md:justify-start">
                                <button onclick="navigate('signup')" class="bg-primary hover:bg-primaryDark text-white px-8 py-4 rounded-full font-semibold text-lg transition shadow-lg shadow-primary/30">Create Free Account</button>
                                <button onclick="navigate('login')" class="bg-slate-100 hover:bg-slate-200 text-slate-800 px-8 py-4 rounded-full font-semibold text-lg transition">Sign In</button>
                            </div>
                        </div>
                        <div class="flex-1 relative">
                            <div class="absolute inset-0 bg-gradient-to-tr from-primary/20 to-secondary/20 rounded-full blur-3xl transform -translate-y-10"></div>
                            <img src="https://placehold.co/600x700/0ea5e9/ffffff?text=Origin+Pay+App+Preview" alt="App Preview" class="relative z-10 rounded-3xl shadow-2xl border-4 border-white rotate-[-2deg] hover:rotate-0 transition duration-500 w-full max-w-md mx-auto">
                        </div>
                    </main>

                    <!-- Features Grid -->
                    <section class="bg-slate-50 py-20">
                        <div class="max-w-6xl mx-auto px-6">
                            <h2 class="text-3xl font-bold text-center mb-12 text-slate-800">Everything you need in one place</h2>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                                ${['Airtime & Data', 'Utility Bills', 'Virtual Accounts', 'NIN/BVN Check'].map((feature, i) => `
                                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center hover:-translate-y-1 transition duration-300">
                                        <div class="w-12 h-12 rounded-full bg-primary/10 text-primary flex items-center justify-center text-xl mb-4">
                                            <i class="fa-solid ${['fa-wifi', 'fa-lightbulb', 'fa-building-columns', 'fa-id-card'][i]}"></i>
                                        </div>
                                        <h3 class="font-semibold text-slate-800">${feature}</h3>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </section>
                </div>
            `;
        }

        function renderAuth() {
            const isLogin = state.view === 'login';
            const isForgot = state.view === 'forgot';
            
            let title = isLogin ? 'Welcome back' : (isForgot ? 'Reset Password' : 'Create an account');
            let subtitle = isLogin ? 'Enter your details to access your dashboard' : (isForgot ? 'Enter your email to receive a reset link' : 'Start using Origin Pay today');
            let btnText = isLogin ? 'Sign In' : (isForgot ? 'Send Link' : 'Create Account');

            return `
                <div class="fade-in min-h-screen bg-slate-50 flex items-center justify-center p-4">
                    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-slate-100">
                        <div class="p-8">
                            <div class="flex items-center justify-center gap-2 text-primary font-bold text-2xl mb-8 cursor-pointer" onclick="navigate('landing')">
                                <div class="w-8 h-8 rounded-lg bg-primary text-white flex items-center justify-center">
                                    <i class="fa-solid fa-bolt"></i>
                                </div>
                                Origin Pay
                            </div>
                            
                            <h2 class="text-2xl font-bold text-slate-800 text-center mb-2">${title}</h2>
                            <p class="text-slate-500 text-center mb-8 text-sm">${subtitle}</p>

                            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-5">
                                ${!isForgot && !isLogin ? `
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                                    <div class="relative">

                                        <input type="text" id="auth-name" required class="w-full pl-10 pr-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition" placeholder="John Doe">
                                    </div>
                                </div>
                                ` : ''}

                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                                    <div class="relative">
                                        <i class="fa-regular fa-envelope absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                                        <input type="email" id="auth-email" required class="w-full pl-10 pr-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition" placeholder="you@example.com">
                                    </div>
                                </div>

                                ${!isForgot ? `

                                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                                    <div class="relative">
                                        <i class="fa-solid fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                                        <input type="password" id="auth-pass" required class="w-full pl-10 pr-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition" placeholder="••••••••">

                                </div>

                                <button type="submit" class="w-full bg-primary hover:bg-primaryDark text-white py-3 rounded-lg font-semibold transition shadow-md shadow-primary/30 flex justify-center items-center gap-2">
                                    <span id="auth-btn-text">${btnText}</span>
                                    <i id="auth-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                                </button>
                            </form>

                            <div class="mt-8 text-center text-sm text-slate-500">
                                ${isLogin ? `Don't have an account? <button onclick="navigate('signup')" class="text-primary font-medium hover:underline">Sign up</button>` : 
                                  isForgot ? `Remember your password? <button onclick="navigate('login')" class="text-primary font-medium hover:underline">Sign in</button>` :
                                  `Already have an account? <button onclick="navigate('login')" class="text-primary font-medium hover:underline">Sign in</button>`}

        function renderDashboard() {
            const services = [

                { id: 'data', name: 'Data', icon: 'fa-wifi', color: 'bg-indigo-100 text-indigo-600' },
                { id: 'electricity', name: 'Electricity', icon: 'fa-lightbulb', color: 'bg-yellow-100 text-yellow-600' },
                { id: 'cable', name: 'Cable TV', icon: 'fa-tv', color: 'bg-purple-100 text-purple-600' },
                { id: 'transfer', name: 'Transfer', icon: 'fa-money-bill-transfer', color: 'bg-emerald-100 text-emerald-600' },
                { id: 'verify', name: 'Verify ID', icon: 'fa-id-card-clip', color: 'bg-rose-100 text-rose-600' },
                { id: 'virtual', name: 'Virtual Acct', icon: 'fa-building-columns', color: 'bg-slate-200 text-slate-700' },

                    <!-- Top Header -->

                                </div>
                            </div>

                                    <i class="fa-solid fa-paper-plane"></i> Send
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Services Grid -->
                    <div class="max-w-3xl mx-auto px-4 mt-8">
                        <h3 class="text-slate-800 font-bold mb-4">Quick Services</h3>
                        <div class="grid grid-cols-4 md:grid-cols-4 gap-x-2 gap-y-6">
                            ${services.map(s => `
                                <button onclick="navigate('service', {type: '${s.id}', name: '${s.name}'})" class="flex flex-col items-center gap-2 group">
                                    <div class="w-14 h-14 rounded-2xl ${s.color} flex items-center justify-center text-xl group-hover:scale-105 group-active:scale-95 transition shadow-sm border border-black/5">
                                        <i class="fa-solid ${s.icon}"></i>
                                    </div>
                                    <span class="text-xs font-medium text-slate-600 text-center">${s.name}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Recent Transactions -->
                    <div class="max-w-3xl mx-auto px-4 mt-8">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-slate-800 font-bold">Recent Transactions</h3>
                            <button class="text-primary text-sm font-medium hover:underline">View All</button>
                        </div>
                        <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden shadow-sm">
                            <div class="p-4 flex items-center justify-between border-b border-slate-50 last:border-0 hover:bg-slate-50 transition">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-full bg-green-100 text-green-600 flex items-center justify-center"><i class="fa-solid fa-arrow-down"></i></div>
                                    <div>
                                        <p class="font-semibold text-sm text-slate-800">Wallet Funding</p>
                                        <p class="text-xs text-slate-500">Today, 10:42 AM</p>
                                    </div>
                                </div>
                                <span class="font-semibold text-green-600">+₦5,000.00</span>
                            </div>
                            <!-- Mock empty state for real integration -->
                            <div class="p-8 text-center text-slate-400 text-sm hidden">
                                No recent transactions
                            </div>
                        </div>
                    </div>

                    <!-- Bottom Mobile Nav -->
                    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 md:hidden flex justify-around p-3 pb-safe z-50 shadow-[0_-5px_15px_-10px_rgba(0,0,0,0.1)]">
                        <button class="flex flex-col items-center text-primary"><i class="fa-solid fa-house mb-1"></i><span class="text-[10px] font-medium">Home</span></button>
                        <button class="flex flex-col items-center text-slate-400 hover:text-primary transition"><i class="fa-solid fa-clock-rotate-left mb-1"></i><span class="text-[10px] font-medium">History</span></button>
                        <button class="flex flex-col items-center text-slate-400 hover:text-primary transition"><i class="fa-solid fa-wallet mb-1"></i><span class="text-[10px] font-medium">Cards</span></button>
                        <button class="flex flex-col items-center text-slate-400 hover:text-primary transition"><i class="fa-solid fa-gear mb-1"></i><span class="text-[10px] font-medium">Settings</span></button>

        function renderService() {
            const srv = state.currentService;
            if(!srv) return renderDashboard(); // Fallback

            return `
                <div class="fade-in min-h-screen bg-slate-50 md:bg-slate-100/50 flex flex-col md:items-center md:pt-10">
                    <div class="bg-white w-full md:max-w-md md:rounded-2xl md:shadow-xl md:border md:border-slate-100 min-h-screen md:min-h-0 flex flex-col relative">
                        <!-- Header -->
                        <div class="p-4 border-b border-slate-100 flex items-center sticky top-0 bg-white z-10 md:rounded-t-2xl">
                            <button onclick="navigate('dashboard')" class="w-10 h-10 rounded-full hover:bg-slate-100 text-slate-600 flex items-center justify-center transition">
                                <i class="fa-solid fa-arrow-left"></i>
                            </button>
                            <h2 class="font-bold text-lg text-slate-800 ml-2">${srv.name || 'Service'}</h2>
                        </div>

                        <!-- Form Area -->
                        <div class="p-6 flex-1">
                            ${getServiceFormHTML(srv.type)}

        }

        // Helper to generate specific forms based on service type
        function getServiceFormHTML(type) {
            if(type === 'airtime' || type === 'data') {
                return `
                    <form onsubmit="handleTransaction(event, '${type}')" class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Network Provider</label>
                            <div class="grid grid-cols-4 gap-2 mb-2">
                                <button type="button" class="border-2 border-primary bg-primary/5 rounded-lg py-2 flex items-center justify-center font-bold text-yellow-500 text-xs">MTN</button>
                                <button type="button" class="border border-slate-200 rounded-lg py-2 flex items-center justify-center font-bold text-green-600 text-xs">GLO</button>
                                <button type="button" class="border border-slate-200 rounded-lg py-2 flex items-center justify-center font-bold text-red-600 text-xs">AIRTEL</button>
                                <button type="button" class="border border-slate-200 rounded-lg py-2 flex items-center justify-center font-bold text-emerald-800 text-xs">9MOB</button>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Phone Number</label>
                            <div class="relative">
                                <i class="fa-solid fa-mobile-screen absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                                <input type="tel" required class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="08012345678">

                        </div>
                        ${type === 'data' ? `
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Data Plan</label>

                                <option value="1">1GB - 30 Days (₦300)</option>
                                <option value="2">2GB - 30 Days (₦600)</option>
                                <option value="5">5GB - 30 Days (₦1500)</option>
                            </select>
                        </div>
                        ` : `
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Amount (₦)</label>
                            <div class="relative">
                                <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-500 font-medium">₦</span>
                                <input type="number" id="tx-amount" min="50" required class="w-full pl-8 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/50 font-semibold" placeholder="0.00">
                            </div>
                        </div>
                        `}
                        <div class="pt-4">
                            <button type="submit" class="w-full bg-primary hover:bg-primaryDark text-white py-4 rounded-xl font-semibold transition shadow-md shadow-primary/30 flex justify-center items-center gap-2">
                                <span id="tx-btn-text">Proceed to Pay</span>
                                <i id="tx-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                            </button>
                        </div>
                    </form>
                `;
            }
            if(type === 'verify') {
                return `
                    <form onsubmit="handleTransaction(event, 'verify')" class="space-y-5">
                        <div class="bg-blue-50 text-blue-800 p-4 rounded-xl text-sm mb-6 border border-blue-100 flex gap-3">
                            <i class="fa-solid fa-shield-halved mt-0.5"></i>
                            <p>Verify identity instantly using our secure API bridge. Fees may apply per verification.</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Verification Type</label>
                            <select required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/50 bg-white">
                                <option value="nin">NIN (National Identity Number)</option>
                                <option value="bvn">BVN (Bank Verification Number)</option>
                                <option value="account">Bank Account Matching</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Enter Number to Verify</label>
                            <div class="relative">
                                <i class="fa-solid fa-hashtag absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                                <input type="text" required class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/50" placeholder="e.g. 12345678901">
                            </div>
                        </div>
                        <div class="pt-4">
                            <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white py-4 rounded-xl font-semibold transition flex justify-center items-center gap-2">
                                <span id="tx-btn-text">Verify Identity Now</span>
                                <i id="tx-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                            </button>
                        </div>
                    </form>
                `;
            }

            // Fallback for others (fund, electricity, etc.)
            return `
                <div class="text-center py-10">
                    <div class="w-20 h-20 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
                        <i class="fa-solid fa-person-digging"></i>
                    </div>
                    <h3 class="font-bold text-slate-700 text-lg mb-2">Coming Soon</h3>
                    <p class="text-slate-500 text-sm">This module connects to your Vercel backend to process this service securely.</p>
                </div>
            `;
        }

        window.handleAuth = async function(e) {
            e.preventDefault();
            if(!auth) {
                // Mock behavior if Firebase isn't configured
                showToast("Development mode: Logging in via mock.", "info");
                state.user = { name: document.getElementById('auth-name')?.value || 'Guest User', email: document.getElementById('auth-email').value };
                navigate('dashboard');
                return;
            }

            const email = document.getElementById('auth-email').value;
            const btnText = document.getElementById('auth-btn-text');
            const spinner = document.getElementById('auth-spinner');
            
            btnText.classList.add('hidden');
            spinner.classList.remove('hidden');

            try {
                if (state.view === 'login') {
                    const pass = document.getElementById('auth-pass').value;
                    // Note: Ensure user handles token appropriately per system instructions in production.
                    await signInWithEmailAndPassword(auth, email, pass);
                    showToast("Logged in successfully", "success");
                    navigate('dashboard');
                } else if (state.view === 'signup') {
                    const pass = document.getElementById('auth-pass').value;
                    const name = document.getElementById('auth-name').value;
                    const cred = await createUserWithEmailAndPassword(auth, email, pass);
                    
                    // Create basic user profile in firestore using user id
                    try {
                        const userDoc = doc(db, 'artifacts', appId, 'users', cred.user.uid, 'profile');
                        await setDoc(userDoc, { name: name, email: email, balance: 0 });
                    } catch(dbErr) { console.warn("DB setup skipped or failed", dbErr); }

                    state.user = { name: name, email: email };
                    showToast("Account created!", "success");
                    navigate('dashboard');
                } else if (state.view === 'forgot') {
                    await sendPasswordResetEmail(auth, email);
                    showToast("Password reset link sent!", "success");
                    navigate('login');
                }
            } catch (error) {
                showToast(error.message, "error");
            } finally {
                btnText.classList.remove('hidden');
                spinner.classList.add('hidden');
            }
        };

        window.handleLogout = function() {
            if(auth) signOut(auth);
            state.user = null;
            navigate('landing');
        };

        window.handleTransaction = async function(e, type) {
            e.preventDefault();
            const btnText = document.getElementById('tx-btn-text');
            const spinner = document.getElementById('tx-spinner');
            
            btnText.classList.add('hidden');
            spinner.classList.remove('hidden');

            // 🚨 THIS IS THE CRITICAL PART WE DISCUSSED 🚨
            // Instead of putting VTpass or Monnify API keys here and calling them directly,
            // we send the request to your secure Vercel API.

            try {
                // Determine mock payload
                const amount = document.getElementById('tx-amount')?.value || 100;
                
                // MOCKING THE VERCEL BACKEND CALL
                // In production: await fetch('/api/process-service', { ... })
                await mockVercelApiCall('process-service', { type: type, amount: amount });
                
                // Success! (In real life, the Vercel backend would have also updated Firebase DB)
                showToast(`${type.toUpperCase()} request processed successfully!`, 'success');
                
                // Simulate balance deduction locally for UX
                if(type === 'airtime' || type === 'data') {
                    state.walletBalance = Math.max(0, state.walletBalance - parseFloat(amount));
                }
                
                setTimeout(() => navigate('dashboard'), 1500);

            } catch(error) {
                showToast(error.message || "Transaction failed", 'error');
            } finally {
                btnText.classList.remove('hidden');
                spinner.classList.add('hidden');
            }
        }

        function render() {
            let html = '';
            switch(state.view) {
                case 'landing': html = renderLanding(); break;
                case 'login': 
                case 'signup': 
                case 'forgot': html = renderAuth(); break;
                case 'dashboard': html = renderDashboard(); break;
                case 'service': html = renderService(); break;
                default: html = renderLanding();
            }
            dom.app.innerHTML = html;
        }

        // Initial render
        render();

    </script>
</body>
</html>
